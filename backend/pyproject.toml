[tool.ruff]
line-length = 130
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "RUF", "DTZ"]
# UP046/UP047: PEP 695 (Python 3.12+ only) generic syntax — ataylab ishlatilmaydi, chunki
# klassik TypeVar/Generic 3.9+'da ham ishlaydi va davlat IT muhitida Python versiyasi
# har doim eng so'nggisi bo'lishiga kafolat yo'q (portativlik moslashuvchanlikdan ustun).
ignore = ["UP046", "UP047"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
warn_unused_ignores = true
disallow_untyped_defs = false

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
